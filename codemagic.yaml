
workflows:
  pdfmaster-workflow:
    name: PDFMaster Build
    max_build_duration: 60
    environment:
      flutter: '3.24.0'
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Clean and analyze
        script: |
          flutter clean
          flutter analyze
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - vikascoading@gmail.com
