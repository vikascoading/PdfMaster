
name: pdfmaster
description: PDFMaster - Android-only full working starter (Merge/Split/Images/Protect placeholders)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  pdf: ^3.9.0
  image: ^4.0.15
  open_file: ^3.2.1
  share_plus: ^6.3.0
  provider: ^6.1.5
  fluttertoast: ^8.2.14
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
