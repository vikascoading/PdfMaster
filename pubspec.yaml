name: pdfmaster
description: A PDF management app built with Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  file_picker: ^8.3.7
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  pdf: ^3.11.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
